name: Build MultiWall Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/webrtc-mirror

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project and Android platform
        run: flutter create --project-name multiwall --platforms=android,ios,web .

      - name: Configure Android app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit("AndroidManifest.xml introuvable")

          s = p.read_text()
          s, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="MultiWall"',
              s,
              count=1
          )
          if count == 0:
              raise SystemExit("Attribut android:label introuvable")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]
          for permission_name in permissions:
              declaration = f'    <uses-permission android:name="{permission_name}" />'
              if permission_name not in s:
                  s = s.replace("<application", declaration + "\\n    <application", 1)

          p.write_text(s)
          print("Configuration Android terminée.")
          PY

      - name: Add app dependencies
        run: |
          flutter pub add supabase_flutter
          flutter pub add flutter_webrtc
          flutter pub add flutter_background

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiWall-Android
          path: build/app/outputs/flutter-apk/app-release.apk
