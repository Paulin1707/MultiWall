
name: Build MultiWall Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project and Android platform
        run: |
          flutter create --project-name multiwall --platforms=android,ios,web .

      - name: Configure Android app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit("AndroidManifest.xml introuvable après flutter create")

          s = p.read_text()

          # Nom visible de l'application
          s, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="MultiWall"',
              s,
              count=1
          )

          if count == 0:
              raise SystemExit("Attribut android:label introuvable")

          # Autorisation Internet
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'

          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", permission + "    <application", 1)

          p.write_text(s)
          print("Nom MultiWall et permission Internet configurés.")

          PY

      - name: Add Supabase dependency
        run: flutter pub add supabase_flutter

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiWall-Android
          path: build/app/outputs/flutter-apk/app-release.apk
